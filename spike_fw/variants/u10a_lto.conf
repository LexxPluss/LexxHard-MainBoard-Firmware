# Unit U10a: size effect of link-time optimisation on the firmware build.
# Passed after microros_nano_nodesc.conf in the EXTRA_CONF_FILE list.
# Baseline B0 (microros_nano_nodesc.conf alone): 275,446 / 253,172.
#
# Kconfig dependency check (zephyr/Kconfig.zephyr:541-545):
#   config LTO depends on
#     !(GEN_ISR_TABLES || GEN_IRQ_VECTOR_TABLE) || ISR_TABLES_LOCAL_DECLARATION
#     !NATIVE_LIBRARY, !CODE_DATA_RELOCATION
# GEN_ISR_TABLES defaults to y on Cortex-M (zephyr/arch/arm/core/cortex_m/Kconfig:311-312),
# so LTO is only selectable with ISR_TABLES_LOCAL_DECLARATION=y
# (zephyr/arch/Kconfig:451-453; needs ISR_TABLES_LOCAL_DECLARATION_SUPPORTED,
# zephyr/arch/Kconfig:441-449: ARM, !USERSPACE, toolchain variant zephyr or gnuarmemb).
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
