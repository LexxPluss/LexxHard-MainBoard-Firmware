# Unit U10e: the three accepted reductions combined (U10a LTO + U10b no executor + U10c direct type support).
# Passed after microros_nano_nodesc.conf in the EXTRA_CONF_FILE list.
# Baseline B0 (microros_nano_nodesc.conf alone): 275,446 / 253,172 (size -B Flash / RAM).
#
# Each reduction measured alone:
#   U10a LTO                 : linker report FLASH 263,696 B (-11,764)
#   U10b no executor         : Flash 267,966 (-7,480)
#   U10c direct type support : Flash 249,282 (-26,164), RAM 244,068 (-9,104)
#
# Reading the result:
#   - Under LTO the size -B RAM figure is not comparable (rodata is classed as data); use the linker
#     report lines FLASH / RAM of the build log.
#   - The MEMBERS counts are 0 under LTO because the objects are merged.
#   - The CMake -u options for the 64-bit atomics apply by themselves when CONFIG_LTO is set.
#
# U10a: LTO is only selectable with ISR_TABLES_LOCAL_DECLARATION (zephyr/Kconfig.zephyr:541-545).
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
CONFIG_LTO=y
# U10b
CONFIG_LEXXHARD_MICROROS_NO_EXECUTOR=y
# U10c
CONFIG_LEXXHARD_MICROROS_DIRECT_TYPESUPPORT=y
