# V5: picolibc; rcutils defines __STDC_WANT_LIB_EXT1__=1 when undefined, which enables picolibc Annex K declarations
# that fail to compile (V2). CONFIG_COMPILER_OPT goes to zephyr_compile_options (zephyr/CMakeLists.txt:503-504),
# which the micro-ROS module passes on to the library build (module CMakeLists.txt:15-27).
CONFIG_NEWLIB_LIBC=n
CONFIG_PICOLIBC=y
CONFIG_COMPILER_OPT="-D__STDC_WANT_LIB_EXT1__=0"
