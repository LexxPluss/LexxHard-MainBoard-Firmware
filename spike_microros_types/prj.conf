CONFIG_GPIO=y
CONFIG_MICROROS=y
CONFIG_MICROROS_TRANSPORT_SERIAL=y
CONFIG_CPP=y

# one publisher per message type the firmware uses (22), up to 12 subscribers, 3 service servers (InitLinearActuator, LinearActuatorLocation, SetBool)
CONFIG_MICROROS_NODES="1"
CONFIG_MICROROS_PUBLISHERS="22"
CONFIG_MICROROS_SUBSCRIBERS="12"
CONFIG_MICROROS_SERVERS="3"
CONFIG_MICROROS_CLIENTS="0"

CONFIG_MAIN_STACK_SIZE=25000
CONFIG_MAIN_THREAD_PRIORITY=3

CONFIG_NEWLIB_LIBC=y
CONFIG_NEWLIB_LIBC_NANO=n
CONFIG_PTHREAD_IPC=n
CONFIG_POSIX_API=y

CONFIG_STDOUT_CONSOLE=y
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_UART_LINE_CTRL=y
